name: Build Custom APK

on:
  workflow_dispatch:
    inputs:
      default_uid:
        description: 'Your UID'
        required: true
        default: 'user_69e24b950537d4.17461984'
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
      activity_label:
        description: 'Activity Label'
        required: true
        default: 'MyActivity'
      main_title:
        description: 'Main Title'
        required: true
        default: 'Welcome'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
      - name: Replace placeholders
        run: |
          sed -i 's|{{DEFAULT_UID}}|'"${{ github.event.inputs.default_uid }}"'|g' app/src/main/java/com/tencent/open/agent/AgentActivity.java
          sed -i 's|{{APP_NAME}}|'"${{ github.event.inputs.app_name }}"'|g' app/src/main/res/values/strings.xml
          sed -i 's|{{APP_NAME}}|'"${{ github.event.inputs.app_name }}"'|g' app/src/main/AndroidManifest.xml
          sed -i 's|{{ACTIVITY_LABEL}}|'"${{ github.event.inputs.activity_label }}"'|g' app/src/main/AndroidManifest.xml
          sed -i 's|{{MAIN_TITLE}}|'"${{ github.event.inputs.main_title }}"'|g' app/src/main/res/layout/activity_main.xml
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-apk
          path: app/build/outputs/apk/release/*.apk
